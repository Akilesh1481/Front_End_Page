<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Furniture Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #3e3e3e;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .container {
            width: 90%;
            margin: 20px auto;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .gallery img {
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 8px;
        }
        .lightbox .close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2em;
            color: white;
            cursor: pointer;
        }
        footer {
            background-color: #3e3e3e;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
        footer p {
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="hm.html">Home</a>
            <a href="gallery.html">Products</a>
            <a href="about.html">About Us</a>
            <a href="gallery.html">Gallery</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="container">
        <h1>Furniture Gallery</h1>
        <div class="gallery">
            <img src="gal1.jpeg" alt="Furniture 1" onclick="openLightbox(this.src)">
            <img src="gal2.jpeg" alt="Furniture 2" onclick="openLightbox(this.src)">
            <img src="gal3.jpeg" alt="Furniture 3" onclick="openLightbox(this.src)">
            <img src="abt.jpeg" alt="Furniture 4" onclick="openLightbox(this.src)">
            <img src="gal4.jpeg" alt="Furniture 5" onclick="openLightbox(this.src)">
            <img src="home.jpeg" alt="Furniture 6" onclick="openLightbox(this.src)">
        </div>
    </section>

    <div class="lightbox" id="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-image" src="" alt="Lightbox Image">
    </div>

    <footer>
        <p>&copy; 2024 Furniture Shop. All Rights Reserved.</p>
    </footer>

    <script>
        function openLightbox(src) {
            document.getElementById('lightbox-image').src = src;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
